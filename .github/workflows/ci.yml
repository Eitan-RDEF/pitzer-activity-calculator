name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest tests/unit
      - name: Native PHREEQC and Streamlit integration tests
        env:
          RUN_PHREEQC_INTEGRATION: "1"
        run: pytest tests/integration

  cloud-run-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --tag pitzer-calculator:ci .
      - name: Smoke-test Streamlit health endpoint
        run: |
          container_id=$(docker run --detach --publish 8080:8080 --env PORT=8080 pitzer-calculator:ci)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
