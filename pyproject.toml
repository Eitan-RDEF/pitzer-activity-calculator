[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pitzer-activity-calculator"
version = "1.0.1"
description = "A transparent, engineer-friendly Pitzer activity calculator powered by PHREEQC."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Eitan Elfassy", email = "eitan.elfassi@gmail.com" },
]
license = "MIT"
keywords = ["Pitzer", "activity coefficient", "aqueous chemistry", "PHREEQC"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "phreeqc==1.1.1",
  "streamlit>=1.42,<2",
]

[project.urls]
Homepage = "https://pitzer-calculator-584210380580.me-west1.run.app"
Repository = "https://github.com/Eitan-RDEF/pitzer-activity-calculator"
Issues = "https://github.com/Eitan-RDEF/pitzer-activity-calculator/issues"
Documentation = "https://github.com/Eitan-RDEF/pitzer-activity-calculator/tree/main/docs"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
